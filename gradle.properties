# file.encoding=COMPAT, not UTF-8: on JDK 18+ COMPAT means the native codepage, which is UTF-8 on
# macOS/Linux (no change there) and CP949 on Korean Windows. Gradle writes the test worker classpath
# to an @argfile in the daemon charset and the Windows java launcher reads it in the native codepage;
# with UTF-8 every non-ASCII path entry is garbled and every unit test dies with ClassNotFoundException.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=COMPAT
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Do NOT add android.defaults.buildfeatures.buildconfig here — removed in AGP 9, it is now a hard
# error at plugin-apply time. Use the per-module buildFeatures block instead.

# The project lives under a Korean-named folder (OneDrive Desktop). AGP refuses non-ASCII paths on
# Windows by default; file.encoding is already forced to UTF-8 above, so the build is fine with it.
android.overridePathCheck=true
